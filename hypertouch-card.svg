<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">HyperTouch — Android Touch Optimization</title>
<desc id="desc">A pixel-tech Android touch optimization interface with a stylized touch device, responsive signal waveform and system status indicators.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#111426"/><stop offset="1" stop-color="#080b14"/></linearGradient>
 <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#202a43" stroke-width="1"/></pattern>
 <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:#e6edff}.dim{fill:#7d8aa8}.c{fill:#8fcaff}.g{fill:#8ce0b9}
.p{animation:blink 2s steps(2,end) infinite}.wave{animation:dash 2.2s linear infinite}.pulse{animation:pulse 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}@keyframes dash{to{stroke-dashoffset:-64}}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="270" fill="url(#bg)"/><rect width="900" height="270" fill="url(#grid)" opacity=".6"/>
<rect x="18" y="17" width="864" height="236" fill="none" stroke="#2c3653" stroke-width="2"/>
<rect x="39" y="34" width="5" height="22" fill="#6caeff"/>
<text x="56" y="50" class="m w" font-size="17" font-weight="700" letter-spacing="1.2">HYPERTOUCH</text>
<text x="56" y="66" class="m dim" font-size="9" letter-spacing="1.3">ANDROID / TOUCH / SYSTEM OPTIMIZATION</text>
<text x="815" y="48" text-anchor="end" class="m dim" font-size="9" letter-spacing="1.1">INPUT NODE 03</text><rect x="851" y="40" width="6" height="6" fill="#8ce0b9" class="p"/>
<path d="M39 88H861M39 199H861" stroke="#263552" stroke-width="2"/>
<!-- device tile -->
<g transform="translate(82 98)">
 <path d="M16 0h94v8h8v91h-8v8H16v-8H8V8h8z" fill="#1b2a4b" stroke="#6b94d5" stroke-width="2"/>
 <rect x="22" y="15" width="80" height="76" fill="#101b32" stroke="#8ebcff" stroke-width="2"/>
 <rect x="30" y="24" width="64" height="57" fill="#182d50" stroke="#557db7"/>
 <rect x="54" y="19" width="16" height="3" fill="#6789c4"/>
 <!-- pixel fingertip and touch target -->
 <path d="M59 37h8v8h8v8h-8v8h-8v-8h-8v-8h8z" fill="#9acbff"/>
 <rect x="48" y="31" width="30" height="30" fill="none" stroke="#5f8fc8" stroke-dasharray="3 3" class="pulse"/>
 <circle cx="63" cy="52" r="3" fill="#e6f3ff"/><circle cx="63" cy="52" r="11" fill="none" stroke="#8fcaff" stroke-width="1.5" class="pulse"/>
 <g fill="#80baff"><rect x="28" y="-7" width="7" height="7"/><rect x="52" y="-7" width="7" height="7"/><rect x="76" y="-7" width="7" height="7"/><rect x="28" y="107" width="7" height="7"/><rect x="52" y="107" width="7" height="7"/><rect x="76" y="107" width="7" height="7"/></g>
</g>
<!-- touch event path -->
<path d="M220 142H306v-22h45M220 142H306v22h45" fill="none" stroke="#5278b4" stroke-width="2"/>
<path d="M220 142H306v-22h45" fill="none" stroke="#89c6ff" stroke-width="1" stroke-dasharray="3 7"/>
<rect x="226" y="139" width="6" height="6" fill="#9bd0ff"><animate attributeName="x" values="226;335;226" dur="3s" repeatCount="indefinite"/></rect>
<!-- signal waveform -->
<g transform="translate(368 100)">
 <rect width="250" height="84" fill="#0c1221" stroke="#405477" stroke-width="2"/>
 <text x="13" y="17" class="m c" font-size="9" letter-spacing="1">TOUCH RESPONSE SIGNAL</text>
 <path d="M14 55H236" stroke="#273650" stroke-width="1"/>
 <path d="M14 55h20l8-7 8 7h12l8-22 8 42 9-20h18l8-9 8 9h15l9-27 9 45 8-21h17l9-8 9 8h24" fill="none" stroke="#8fcaff" stroke-width="2" stroke-dasharray="7 5" class="wave"/>
 <circle cx="177" cy="55" r="4" fill="#bde0ff" class="pulse"/><circle cx="177" cy="55" r="9" fill="none" stroke="#8fcaff" class="pulse"/>
 <text x="14" y="75" class="m dim" font-size="8">INPUT → RESPONSE</text>
</g>
<!-- status panel -->
<g transform="translate(654 100)">
 <rect width="190" height="84" fill="#0c1221" stroke="#405477" stroke-width="2"/>
 <text x="13" y="17" class="m c" font-size="9" letter-spacing="1">SYSTEM STATUS</text>
 <g class="m" font-size="9"><rect x="13" y="29" width="7" height="7" fill="#8ce0b9"/><text x="29" y="36" class="w">TOUCH LAYER</text><text x="176" y="36" text-anchor="end" class="g">READY</text><rect x="13" y="46" width="7" height="7" fill="#8ce0b9"/><text x="29" y="53" class="w">KERNEL MOD</text><text x="176" y="53" text-anchor="end" class="g">NONE</text><rect x="13" y="63" width="7" height="7" fill="#8fcaff" class="p"/><text x="29" y="70" class="w">INPUT STREAM</text><text x="176" y="70" text-anchor="end" class="c">LIVE</text></g>
</g>
<text x="39" y="224" class="m dim" font-size="9" letter-spacing="1.1">TOUCH INPUT  /  SIGNAL  /  RESPONSE  /  OPTIMIZATION</text>
<text x="815" y="224" text-anchor="end" class="m dim" font-size="9" letter-spacing="1.1">SEP // SYSTEMS</text>
<path d="M39 238H830" stroke="#2a3652" stroke-width="2"/><path d="M39 238H220" stroke="#6caeff" stroke-width="2"/>
<g transform="translate(850 220) scale(.95)" fill="#d5e2ed" aria-label="GitHub"><path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.2 3.26.92.1-.72.39-1.2.71-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.03.76 2.08v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9z"/></g>
</svg>
