<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">HyperCore — Kernel Build Environment</title>
<desc id="desc">A restrained 16-bit pixel-art kernel workstation: a luminous processor board, build pipeline and compact terminal status display.</desc>
<defs>
 <linearGradient id="b" x2="0" y2="1"><stop stop-color="#111426"/><stop offset="1" stop-color="#080b14"/></linearGradient>
 <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#202a43" stroke-width="1"/></pattern>
 <filter id="gl" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:#e6edff}.dim{fill:#7d8aa8}.c{fill:#8fcaff}.g{fill:#8ce0b9}
.p{animation:blink 2.2s steps(2,end) infinite}.p2{animation-delay:-1.1s}
.flow{animation:flow 3.2s steps(8,end) infinite}.flow2{animation-delay:-1.6s}
.load{animation:load 7s steps(12,end) infinite;transform-origin:left}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes flow{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(190px);opacity:0}}
@keyframes load{0%{transform:scaleX(.12)}65%{transform:scaleX(.76)}100%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="270" fill="url(#b)"/><rect width="900" height="270" fill="url(#g)" opacity=".6"/>
<rect x="18" y="17" width="864" height="236" fill="none" stroke="#2c3653" stroke-width="2"/>
<!-- title -->
<rect x="39" y="34" width="5" height="22" fill="#6caeff"/>
<text x="56" y="50" class="m w" font-size="17" font-weight="700" letter-spacing="1.2">HYPERCORE</text>
<text x="56" y="66" class="m dim" font-size="9" letter-spacing="1.3">ANDROID GKI / KERNEL BUILD ENVIRONMENT</text>
<text x="840" y="48" text-anchor="end" class="m dim" font-size="9" letter-spacing="1.1">BUILD NODE 01</text>
<rect x="851" y="40" width="6" height="6" fill="#8ce0b9" class="p"/>
<!-- board background -->
<path d="M38 88H862M38 199H862" stroke="#263552" stroke-width="2"/>
<!-- left terminal -->
<rect x="52" y="101" width="208" height="82" fill="#0c1221" stroke="#405477" stroke-width="2"/>
<rect x="52" y="101" width="208" height="13" fill="#1a2740"/>
<circle cx="63" cy="107" r="2" fill="#e58c76"/><circle cx="72" cy="107" r="2" fill="#d7b46e"/><circle cx="81" cy="107" r="2" fill="#82c6a9"/>
<text x="63" y="130" class="m c" font-size="9">hypercore@build:~</text>
<text x="63" y="145" class="m w" font-size="9">$ make kernel</text>
<text x="63" y="160" class="m dim" font-size="8">ARCH=arm64  LLVM=1</text>
<text x="63" y="174" class="m g" font-size="8">[ compiling objects ]</text>
<!-- middle pixel processor, stepped silhouette -->
<g transform="translate(345 82)">
 <path d="M24 0h112v8h16v16h8v64h-8v16h-16v8H24v-8H8V88H0V24h8V8h16z" fill="#1b2a4b" stroke="#6b94d5" stroke-width="2"/>
 <path d="M32 12h96v8h12v56h-12v8H32v-8H20V20h12z" fill="#111d35" stroke="#9ac7ff" stroke-width="2"/>
 <rect x="43" y="31" width="74" height="48" fill="#182d50" stroke="#557db7" stroke-width="2"/>
 <path d="M51 40h58v6H51zM51 52h58v6H51zM51 64h58v6H51z" fill="#355887"/>
 <text x="80" y="59" text-anchor="middle" class="m w" font-size="18" font-weight="700">HC</text>
 <!-- pixel pins -->
 <g fill="#80baff">
 <rect x="32" y="-8" width="8" height="8"/><rect x="56" y="-8" width="8" height="8"/><rect x="80" y="-8" width="8" height="8"/><rect x="104" y="-8" width="8" height="8"/><rect x="128" y="-8" width="8" height="8"/>
 <rect x="32" y="112" width="8" height="8"/><rect x="56" y="112" width="8" height="8"/><rect x="80" y="112" width="8" height="8"/><rect x="104" y="112" width="8" height="8"/><rect x="128" y="112" width="8" height="8"/>
 <rect x="-8" y="24" width="8" height="8"/><rect x="-8" y="48" width="8" height="8"/><rect x="-8" y="72" width="8" height="8"/><rect x="160" y="24" width="8" height="8"/><rect x="160" y="48" width="8" height="8"/><rect x="160" y="72" width="8" height="8"/>
 </g>
 <rect x="50" y="40" width="60" height="4" fill="#a9d6ff" opacity=".35" filter="url(#gl)" class="p"/>
</g>
<!-- circuit traces -->
<path d="M260 142h77v-22h16M513 142h70v-24h34M513 142h70v25h34" fill="none" stroke="#5278b4" stroke-width="2"/>
<path d="M260 142h77v-22h16M513 142h70v-24h34" fill="none" stroke="#89c6ff" stroke-width="1" stroke-dasharray="3 7"/>
<rect x="270" y="138" width="6" height="6" fill="#9bd0ff" class="flow"/>
<rect x="270" y="138" width="6" height="6" fill="#9bd0ff" class="flow flow2"/>
<!-- right build stages -->
<g transform="translate(625 100)">
 <rect width="220" height="84" fill="#0c1221" stroke="#405477" stroke-width="2"/>
 <text x="13" y="17" class="m c" font-size="9" letter-spacing="1">PIPELINE</text>
 <g class="m" font-size="9">
  <rect x="13" y="27" width="7" height="7" fill="#79b8f5"/><text x="29" y="34" class="w">SOURCE SYNC</text><text x="201" y="34" text-anchor="end" class="g">OK</text>
  <rect x="13" y="42" width="7" height="7" fill="#79b8f5"/><text x="29" y="49" class="w">PATCH SET</text><text x="201" y="49" text-anchor="end" class="g">OK</text>
  <rect x="13" y="57" width="7" height="7" fill="#79b8f5" class="p"/><text x="29" y="64" class="w">KERNEL IMAGE</text><text x="201" y="64" text-anchor="end" class="c">RUN</text>
 </g>
 <rect x="13" y="73" width="194" height="3" fill="#25334e"/><rect x="13" y="73" width="194" height="3" fill="#6caeff" class="load"/>
</g>
<!-- footer -->
<text x="39" y="224" class="m dim" font-size="9" letter-spacing="1.1">SOURCE  /  PATCH  /  COMPILE  /  PACKAGE</text>
<text x="815" y="224" text-anchor="end" class="m dim" font-size="9" letter-spacing="1.1">SEP // SYSTEMS</text>
<path d="M39 238H830" stroke="#2a3652" stroke-width="2"/><path d="M39 238H220" stroke="#6caeff" stroke-width="2"/>


<g transform="translate(850 220) scale(.95)" fill="#d5e2ed" aria-label="GitHub">
  <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.2 3.26.92.1-.72.39-1.2.71-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.03.76 2.08v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9z"/>
</g>
</svg>