<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
  <title id="title">HyperCore — Kernel Build Environment</title>
  <desc id="desc">A quiet pixel-art workstation at 3 AM. A developer watches an Android kernel build progress in a terminal while rain moves outside the window.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101a2b"/><stop offset="1" stop-color="#080d18"/></linearGradient>
    <linearGradient id="screen" x2="0" y2="1"><stop stop-color="#142b35"/><stop offset="1" stop-color="#0b1722"/></linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="windowClip"><rect x="42" y="36" width="230" height="112"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .muted{fill:#71859a}.green{fill:#8de5b1}.cyan{fill:#78dce8}.amber{fill:#e9b96e}
    .rain{animation:rain 1.2s linear infinite}.rain.r2{animation-delay:-.4s}.rain.r3{animation-delay:-.8s}
    .blink{animation:blink 1.15s steps(2,end) infinite}.pulse{animation:pulse 2.8s ease-in-out infinite}
    .progress{animation:progress 7s steps(12,end) infinite;transform-origin:left center}
    .scan{animation:scan 5s linear infinite}
    .head{animation:breathe 3s ease-in-out infinite;transform-origin:575px 127px}
    @keyframes rain{from{transform:translateY(-12px)}to{transform:translateY(18px)}}
    @keyframes blink{0%,48%{opacity:1}49%,100%{opacity:.25}}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.8}}
    @keyframes progress{0%{transform:scaleX(.08)}45%{transform:scaleX(.74)}75%{transform:scaleX(.92)}90%,100%{transform:scaleX(1)}}
    @keyframes scan{0%{transform:translateY(-70px);opacity:0}15%{opacity:.2}85%{opacity:.12}100%{transform:translateY(70px);opacity:0}}
    @keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1.5px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>
  <!-- room -->
  <rect width="900" height="270" fill="url(#bg)"/>
  <rect x="16" y="16" width="868" height="238" fill="none" stroke="#26384a" stroke-width="2"/>
  <path d="M16 188H884" stroke="#304254" stroke-width="2"/>
  <!-- rainy window -->
  <rect x="36" y="30" width="242" height="124" fill="#0b1422" stroke="#34475a" stroke-width="5"/>
  <g clip-path="url(#windowClip)">
    <rect x="42" y="36" width="230" height="112" fill="#101f35"/>
    <path d="M42 111h230v37H42z" fill="#14253a"/>
    <path d="M42 119h230M42 132h230" stroke="#263b50" stroke-width="2"/>
    <g fill="#e9b96e"><rect x="72" y="81" width="5" height="5"/><rect x="89" y="91" width="4" height="4"/><rect x="210" y="70" width="5" height="5"/><rect x="231" y="88" width="4" height="4"/></g>
    <g stroke="#77b7cf" stroke-width="2" opacity=".6">
      <path class="rain" d="M60 42v10M96 64v10M130 39v10M166 75v10M198 43v10M245 58v10"/>
      <path class="rain r2" d="M78 111v10M115 92v10M151 112v10M184 101v10M222 113v10M258 92v10"/>
      <path class="rain r3" d="M52 76v10M105 45v10M143 58v10M177 39v10M236 76v10"/>
    </g>
    <path d="M157 36v112M42 92h230" stroke="#31485e" stroke-width="3"/>
  </g>
  <text x="42" y="22" class="mono muted" font-size="9" letter-spacing="2">NIGHT SHIFT / 03:00 AM</text>
  <!-- clock -->
  <rect x="314" y="34" width="92" height="31" fill="#101b2b" stroke="#33485b" stroke-width="2"/>
  <text x="360" y="55" text-anchor="middle" class="mono cyan" font-size="16">03:00</text>
  <circle cx="395" cy="45" r="2" class="pulse" fill="#78dce8"/>
  <!-- wall notes -->
  <rect x="435" y="35" width="90" height="42" fill="#172438" stroke="#31465a" stroke-width="2"/>
  <text x="445" y="51" class="mono muted" font-size="8">BUILD NOTES</text>
  <path d="M445 59h58M445 66h41" stroke="#6d879b" stroke-width="2"/>
  <!-- desk -->
  <path d="M300 190H850v12H300z" fill="#344254"/>
  <path d="M330 202h10v44h-10zM810 202h10v44h-10z" fill="#263447"/>
  <path d="M300 246h550" stroke="#42536a" stroke-width="3"/>
  <!-- monitor glow and screen -->
  <ellipse cx="684" cy="171" rx="145" ry="80" fill="#4dc6c5" opacity=".055" class="pulse"/>
  <rect x="620" y="57" width="208" height="119" fill="#080f18" stroke="#536779" stroke-width="4"/>
  <rect x="628" y="65" width="192" height="103" fill="url(#screen)"/>
  <g class="mono" font-size="9">
    <text x="640" y="80" class="cyan">HYPERCORE / BUILD PIPELINE</text>
    <text x="640" y="96" class="muted">target: android-gki 6.1</text>
    <text x="640" y="111" class="green">&gt; configuring kernel...</text>
    <text x="640" y="126" fill="#9bb0c1">&gt; applying patches</text>
    <text x="640" y="141" class="green">&gt; compiling Image.gz</text>
    <text x="640" y="157" class="amber">[ BUILD IN PROGRESS ]</text>
  </g>
  <rect x="640" y="161" width="166" height="3" fill="#263e4a"/>
  <rect x="640" y="161" width="166" height="3" fill="#7ee0a9" class="progress"/>
  <rect x="714" y="176" width="20" height="13" fill="#43576b"/>
  <rect x="692" y="188" width="64" height="5" fill="#52687c"/>
  <rect x="630" y="69" width="188" height="2" fill="#a1f0d2" opacity=".18" class="scan"/>
  <!-- developer silhouette -->
  <g class="head">
    <path d="M520 188v-27q0-31 28-39l20-4 26 10q15 12 13 34v26z" fill="#253449"/>
    <path d="M542 121q6-20 29-20 24 0 30 23l-8 17h-46z" fill="#172638"/>
    <path d="M548 128q7-17 25-17 17 0 23 17v20q-7 14-25 14-18 0-23-14z" fill="#c58e70"/>
    <path d="M544 128q1-27 29-29 24 1 30 24l-10-4-8-10-18 8-13 1z" fill="#1b2637"/>
    <rect x="559" y="139" width="4" height="3" fill="#172638"/><rect x="581" y="139" width="4" height="3" fill="#172638"/>
    <path d="M567 151h9" stroke="#8b5d53" stroke-width="2"/>
    <path d="M514 183q20-21 45-21 35 0 58 27v8h-103z" fill="#33465d"/>
    <path d="M542 169l18 10 17-10" fill="none" stroke="#5b7187" stroke-width="3"/>
  </g>
  <!-- keyboard and mug -->
  <path d="M500 198h92l-9 12h-74z" fill="#1b2a3c" stroke="#41566b" stroke-width="2"/>
  <path d="M509 202h73" stroke="#79cdd4" stroke-width="2" stroke-dasharray="4 4" opacity=".7"/>
  <rect x="438" y="177" width="26" height="22" fill="#293c50"/>
  <path d="M464 182h7v11h-7" fill="none" stroke="#536b7e" stroke-width="3"/>
  <path d="M444 172q-4-7 1-10M454 172q-4-7 1-10" stroke="#9bb7c1" stroke-width="2" fill="none" opacity=".55"/>
  <!-- tiny status LEDs -->
  <rect x="843" y="39" width="5" height="5" fill="#8de5b1" class="blink"/><rect x="854" y="39" width="5" height="5" fill="#78dce8" class="pulse"/>
  <!-- footer identity -->
  <text x="42" y="226" class="mono" fill="#d5e2ed" font-size="15" letter-spacing="1.5">HyperCore<tspan fill="#71859a">/systems</tspan></text>
  <text x="42" y="242" class="mono muted" font-size="8" letter-spacing="1.2">KERNEL BUILD ENVIRONMENT</text>
  <g transform="translate(850 220) scale(.95)" fill="#d5e2ed" aria-label="GitHub">
    <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.2 3.26.92.1-.72.39-1.2.71-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.03.76 2.08v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9z"/>
  </g>
  <rect x="16" y="16" width="868" height="238" fill="none" stroke="#26384a" stroke-width="2"/>
</svg>
