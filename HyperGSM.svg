<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc" shape-rendering="crispEdges">
<title id="title">HyperGSM — Google Services Integration</title>
<desc id="desc">A clean pixel-art system map connecting a Xiaomi HyperOS device environment to Google Play Services through a controlled integration layer.</desc>
<defs>
 <linearGradient id="b" x2="0" y2="1"><stop stop-color="#111426"/><stop offset="1" stop-color="#080b14"/></linearGradient>
 <pattern id="g" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16 0H0V16" fill="none" stroke="#202a43" stroke-width="1"/></pattern>
 <filter id="gl" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<style>
.m{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.w{fill:#e6edff}.dim{fill:#7d8aa8}.o{fill:#ffad70}.c{fill:#9ac8ff}.g{fill:#8ce0b9}
.p{animation:blink 2.4s steps(2,end) infinite}.p2{animation-delay:-1.2s}
.data{animation:move 3.4s steps(8,end) infinite}.data.d2{animation-delay:-1.7s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes move{0%{transform:translateX(0);opacity:0}12%{opacity:1}88%{opacity:1}100%{transform:translateX(210px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="900" height="270" fill="url(#b)"/><rect width="900" height="270" fill="url(#g)" opacity=".6"/>
<rect x="18" y="17" width="864" height="236" fill="none" stroke="#2c3653" stroke-width="2"/>
<!-- header -->
<rect x="39" y="34" width="5" height="22" fill="#ff9141"/>
<text x="56" y="50" class="m w" font-size="17" font-weight="700" letter-spacing="1.2">HYPERGSM</text>
<text x="56" y="66" class="m dim" font-size="9" letter-spacing="1.3">HYPEROS / GOOGLE SERVICES INTEGRATION</text>
<text x="840" y="48" text-anchor="end" class="m dim" font-size="9" letter-spacing="1.1">CONNECTIVITY NODE 02</text>
<rect x="851" y="40" width="6" height="6" fill="#8ce0b9" class="p"/>
<!-- left device tile -->
<g transform="translate(75 93)">
 <rect x="0" y="0" width="176" height="96" fill="#171522" stroke="#a85d38" stroke-width="2"/>
 <rect x="8" y="8" width="160" height="80" fill="#201a23" stroke="#653e35"/>
 <rect x="20" y="20" width="44" height="44" fill="#ed6b25"/>
 <rect x="26" y="26" width="32" height="32" fill="#ff9a45"/>
 <!-- pixel MI-like monogram -->
 <path d="M32 33h7v20h-7zM42 33h14v7h-7v13h-7z" fill="#fff3e7"/>
 <text x="77" y="37" class="m w" font-size="11">XIAOMI</text>
 <text x="77" y="52" class="m dim" font-size="8">HYPEROS / CN ROM</text>
 <text x="20" y="78" class="m o" font-size="8">ANDROID DEVICE</text>
</g>
<!-- central integration module -->
<g transform="translate(364 83)">
 <path d="M16 0h140v8h8v90h-8v8H16v-8H8V8h8z" fill="#1a2744" stroke="#6789c4" stroke-width="2"/>
 <rect x="24" y="16" width="124" height="74" fill="#101a30" stroke="#8ebcff" stroke-width="2"/>
 <rect x="37" y="29" width="98" height="48" fill="#1b2e50" stroke="#4c6fa8"/>
 <path d="M46 39h80v5H46zM46 51h80v5H46zM46 63h80v5H46z" fill="#385987"/>
 <text x="86" y="58" text-anchor="middle" class="m w" font-size="16" font-weight="700">GMS</text>
 <g fill="#8ebcff"><rect x="32" y="-7" width="8" height="7"/><rect x="56" y="-7" width="8" height="7"/><rect x="80" y="-7" width="8" height="7"/><rect x="104" y="-7" width="8" height="7"/><rect x="128" y="-7" width="8" height="7"/><rect x="32" y="106" width="8" height="7"/><rect x="56" y="106" width="8" height="7"/><rect x="80" y="106" width="8" height="7"/><rect x="104" y="106" width="8" height="7"/><rect x="128" y="106" width="8" height="7"/></g>
 <text x="86" y="124" text-anchor="middle" class="m dim" font-size="8">SERVICE LAYER</text>
 <rect x="79" y="36" width="14" height="4" fill="#a6d4ff" class="p" filter="url(#gl)"/>
</g>
<!-- right services tile -->
<g transform="translate(649 93)">
 <rect x="0" y="0" width="176" height="96" fill="#151a2a" stroke="#5876b9" stroke-width="2"/>
 <rect x="8" y="8" width="160" height="80" fill="#171e31" stroke="#394e82"/>
 <rect x="20" y="20" width="44" height="44" fill="#edf2ff"/>
 <!-- pixel G mark -->
 <path d="M54 30h-8v-4h-12v4h-5v5h-4v12h4v6h5v4h12v-4h7v-7h-7v4h-10v-4h-4v-10h4v-4h10v4h8z" fill="#4285f4"/>
 <path d="M29 35h7v-5h10v-4H34v4h-5z" fill="#ea4335"/>
 <path d="M29 48h7v5h10v4H34v-4h-5z" fill="#34a853"/>
 <path d="M25 35h5v13h-5z" fill="#fbbc05"/>
 <text x="77" y="37" class="m w" font-size="11">GOOGLE</text>
 <text x="77" y="52" class="m dim" font-size="8">PLAY SERVICES</text>
 <text x="20" y="78" class="m c" font-size="8">PUSH / API / LOCATION</text>
</g>
<!-- data link -->
<path d="M251 141H364M532 141H649" stroke="#45628f" stroke-width="6" opacity=".35"/>
<path d="M251 141H364M532 141H649" stroke="#779ed8" stroke-width="2" stroke-dasharray="4 7"/>
<path d="M251 119h44v-13h69M251 163h44v13h69M649 119h-44v-13h-69M649 163h-44v13h-69" fill="none" stroke="#405987" stroke-width="2"/>
<rect x="258" y="137" width="6" height="6" fill="#ffb17a" class="data"/>
<rect x="258" y="137" width="6" height="6" fill="#a9ceff" class="data d2"/>
<!-- bottom metadata -->
<path d="M39 211H861" stroke="#2a3652" stroke-width="2"/>
<text x="39" y="229" class="m dim" font-size="9" letter-spacing="1">DEVICE LAYER  /  SERVICE BRIDGE  /  GOOGLE API</text>
<text x="815" y="229" text-anchor="end" class="m dim" font-size="9" letter-spacing="1">SEP // SYSTEMS</text>
<path d="M39 240H830" stroke="#2a3652" stroke-width="2"/><path d="M39 240H220" stroke="#ff9141" stroke-width="2"/>


<g transform="translate(850 220) scale(.95)" fill="#d5e2ed" aria-label="GitHub">
  <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.2 3.26.92.1-.72.39-1.2.71-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.03.76 2.08v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9z"/>
