<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-labelledby="title desc">
<title id="title">HyperGSM — HyperOS / Google Services Integration</title>
<desc id="desc">A crisp, animated vector system diagram. Xiaomi Mi mark on the left connects through a GMS service bridge to the Google G mark on the right.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#111426"/>
    <stop offset="1" stop-color="#0b0e1d"/>
  </linearGradient>
  <linearGradient id="miTile" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ff8730"/>
    <stop offset="1" stop-color="#ed5a00"/>
  </linearGradient>
  <linearGradient id="chipFace" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#20345b"/>
    <stop offset="1" stop-color="#142441"/>
  </linearGradient>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="3.5"/>
  </filter>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <path d="M16 0H0V16" fill="none" stroke="#29334d" stroke-width=".7" opacity=".45"/>
  </pattern>
  <clipPath id="panelClip">
    <rect x="18" y="16" width="864" height="238" rx="1"/>
  </clipPath>
</defs>
<style>
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
  .white{fill:#e9efff}
  .muted{fill:#8290ad}
  .micro{font-size:8px;letter-spacing:1.15px}
  .small{font-size:9px;letter-spacing:.6px}
  .wire{fill:none;stroke:#526b9b;stroke-width:1.7;shape-rendering:crispEdges}
  .dash{fill:none;stroke:#88baff;stroke-width:1.6;stroke-dasharray:4 7;opacity:.76}
  .packet{animation:packet 3.4s linear infinite}
  .packet.delay{animation-delay:-1.7s}
  .status{animation:blink 2.4s steps(2,end) infinite}
  .pulse{animation:pulse 2.8s ease-in-out infinite}
  .scan{animation:scan 5.8s linear infinite}
  @keyframes packet{
    0%{transform:translateX(0);opacity:0}
    12%{opacity:1}
    88%{opacity:1}
    100%{transform:translateX(180px);opacity:0}
  }
  @keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.18}50%{opacity:.62}}
  @keyframes scan{0%{transform:translateY(0);opacity:0}12%{opacity:.16}86%{opacity:.1}100%{transform:translateY(72px);opacity:0}}
  @media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<!-- Background and frame -->
<rect width="900" height="270" fill="url(#bg)"/>
<rect width="900" height="270" fill="url(#grid)" opacity=".58"/>
<rect x="18" y="16" width="864" height="238" fill="none" stroke="#2d3854" stroke-width="2"/>
<g clip-path="url(#panelClip)">
  <rect x="20" y="18" width="860" height="2" fill="#8295c1" opacity=".11" class="scan"/>
</g>

<!-- Header -->
<rect x="39" y="34" width="5" height="23" fill="#ff9141"/>
<text x="56" y="50" class="mono white" font-size="17" font-weight="700" letter-spacing="1.2">HYPERGSM</text>
<text x="56" y="66" class="mono muted micro">HYPEROS / GOOGLE SERVICES INTEGRATION</text>
<text x="842" y="47" text-anchor="end" class="mono muted micro">CONNECTIVITY NODE #2</text>
<rect x="850" y="40" width="6" height="6" fill="#8ce0b9" class="status"/>

<!-- Left Xiaomi platform card -->
<g>
  <rect x="74" y="92" width="178" height="100" fill="#1d1822" stroke="#a65b36" stroke-width="2"/>
  <rect x="82" y="100" width="162" height="84" fill="none" stroke="#654237" stroke-width="1.4"/>
  <rect x="94" y="112" width="46" height="46" rx="3" fill="#9e4319" opacity=".45"/>
  <rect x="96" y="109" width="44" height="46" rx="3" fill="url(#miTile)" stroke="#ffad6b" stroke-width="1.2"/>
  <rect x="99" y="112" width="38" height="40" rx="2" fill="none" stroke="#ffbf83" stroke-width=".7" opacity=".7"/>

  <!-- Xiaomi Mi mark redrawn as clean vector geometry, matching the second reference -->
  <g fill="#fffaf2" transform="translate(101 119)">
    <!-- lowercase m: straight verticals and squared inner channels -->
    <path d="M3 7
             Q3 4 6 4
             H20 Q23 4 23 7
             V27 H17 V10 H14 V27 H9 V10 H6 V27 H1 V7
             Q1 4 3 4Z"
          transform="translate(0 0) scale(.96 1)"/>
    <!-- lowercase i stem -->
    <path d="M28 4 H33 V27 H28 Z"/>
  </g>

  <text x="153" y="128" class="mono white" font-size="10.5" font-weight="700" letter-spacing=".4">XIAOMI</text>
  <text x="153" y="143" class="mono muted" font-size="7.8" letter-spacing=".2">HYPEROS / CN ROM</text>
  <text x="94" y="174" class="mono" fill="#d49a76" font-size="8" letter-spacing=".8">ANDROID DEVICE</text>
</g>

<!-- Connection lines behind central chip -->
<path class="wire" d="M252 119H296V106H366"/>
<path class="wire" d="M252 166H296V180H366"/>
<path class="wire" d="M534 106H604V119H649"/>
<path class="wire" d="M534 180H604V166H649"/>
<path class="wire" d="M252 143H368"/>
<path class="wire" d="M532 143H649"/>
<path class="dash" d="M252 143H368"/>
<path class="dash" d="M532 143H649"/>
<rect x="261" y="140" width="6" height="6" fill="#a8d4ff" class="packet"/>
<rect x="261" y="140" width="6" height="6" fill="#a8d4ff" class="packet delay"/>
<rect x="533" y="140" width="6" height="6" fill="#a8d4ff" class="packet"/>
<rect x="533" y="140" width="6" height="6" fill="#a8d4ff" class="packet delay"/>

<!-- Central GMS bridge / processor -->
<g>
  <path d="M378 81H522V89H531V186H522V194H378V186H369V89H378Z"
        fill="#172541" stroke="#6384c0" stroke-width="2"/>
  <path d="M387 90H513V98H522V177H513V185H387V177H378V98H387Z"
        fill="#101a30" stroke="#91baff" stroke-width="1.8"/>
  <rect x="401" y="109" width="98" height="65" fill="url(#chipFace)" stroke="#4c6da4" stroke-width="1.5"/>
  <rect x="410" y="119" width="80" height="5" fill="#385783"/>
  <rect x="410" y="139" width="80" height="5" fill="#385783"/>
  <rect x="410" y="159" width="80" height="5" fill="#385783"/>
  <text x="450" y="148" text-anchor="middle" class="mono white" font-size="15" font-weight="700">GMS</text>
  <ellipse cx="450" cy="139" rx="42" ry="27" fill="#7cb5ff" opacity=".09" filter="url(#softGlow)" class="pulse"/>
  <!-- processor pins -->
  <g fill="#8ebaff">
    <rect x="397" y="74" width="8" height="7"/>
    <rect x="422" y="74" width="8" height="7"/>
    <rect x="447" y="74" width="8" height="7"/>
    <rect x="472" y="74" width="8" height="7"/>
    <rect x="497" y="74" width="8" height="7"/>
    <rect x="397" y="194" width="8" height="7"/>
    <rect x="422" y="194" width="8" height="7"/>
    <rect x="447" y="194" width="8" height="7"/>
    <rect x="472" y="194" width="8" height="7"/>
    <rect x="497" y="194" width="8" height="7"/>
  </g>
  <text x="450" y="209" text-anchor="middle" class="mono muted" font-size="7.2" letter-spacing=".6">SERVICE LAYER</text>
</g>

<!-- Right Google services card -->
<g>
  <rect x="649" y="92" width="177" height="100" fill="#172034" stroke="#5977b7" stroke-width="2"/>
  <rect x="657" y="100" width="161" height="84" fill="none" stroke="#3e5689" stroke-width="1.4"/>
  <rect x="669" y="109" width="46" height="46" rx="3" fill="#e8edf7" stroke="#aebbd2" stroke-width="1.2"/>
  <rect x="672" y="112" width="40" height="40" rx="2" fill="#fff"/>
  <!-- Google G: four authentic brand-color segments on white tile, no skew or perspective -->
  <g transform="translate(679 118) scale(1.25)">
    <path fill="#4285F4" d="M23.49 12.27c0-.78-.07-1.53-.2-2.27H12v4.51h6.44a5.5 5.5 0 0 1-2.39 3.61v2.93h3.87c2.26-2.08 3.57-5.15 3.57-8.78z"/>
    <path fill="#34A853" d="M12 24c3.24 0 5.96-1.08 7.95-2.95l-3.87-2.93c-1.08.72-2.46 1.15-4.08 1.15-3.13 0-5.78-2.11-6.73-4.96H1.27v3.02A12 12 0 0 0 12 24z"/>
    <path fill="#FBBC05" d="M5.27 14.31A7.2 7.2 0 0 1 4.64 12c0-.8.14-1.58.39-2.31V6.67H1.27A12 12 0 0 0 0 12c0 1.93.46 3.75 1.27 5.33l4-3.02z"/>
    <path fill="#EA4335" d="M12 4.73c1.77 0 3.36.61 4.61 1.8l3.44-3.44C17.96 1.17 15.24 0 12 0 7.31 0 3.25 2.69 1.27 6.67l3.76 3.02C5.98 6.84 8.63 4.73 12 4.73z"/>
  </g>
  <text x="728" y="128" class="mono white" font-size="10.5" font-weight="700" letter-spacing=".5">GOOGLE</text>
  <text x="728" y="143" class="mono muted" font-size="7.8" letter-spacing=".3">PLAY SERVICES</text>
  <text x="670" y="174" class="mono" fill="#9bb8e7" font-size="7.8" letter-spacing=".3">PUSH / API / LOCATION</text>
</g>

<!-- Footer -->
<path d="M39 217H861" stroke="#2b3652" stroke-width="1.8"/>
<text x="39" y="233" class="mono muted micro">DEVICE LAYER / SERVICE BRIDGE / GOOGLE API</text>
<text x="814" y="233" text-anchor="end" class="mono muted micro">SEP // SYSTEMS</text>
<path d="M39 246H830" stroke="#2b3652" stroke-width="1.8"/>
<path d="M39 240H220" stroke="#ff9141" stroke-width="1.8"/>
<!-- Official Octocat silhouette retained in vector form -->
<g transform="translate(850 219) scale(.78)" fill="#dce7f5" aria-label="GitHub Octocat">
  <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.56.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.3-1.24-1.65-1.24-1.65-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 1.7 2.62 1.2 3.26.92.1-.72.39-1.2.71-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.62 5.23-5.11 5.51.4.35.76 1.03.76 2.08v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9z"/>
</g>
</svg>